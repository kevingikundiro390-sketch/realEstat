services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_SUPABASE_URL=https://kmxagcabgppesvkjyzwf.supabase.co
      - VITE_SUPABASE_ANON_KEY=sb_publishable_SuUsn__5xmb9ThuVkc2how_A7Ud6TyB
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --port 3000 --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure
